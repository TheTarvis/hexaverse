        echo "ERROR: PROMOTED_AGENT_TAG not set - agent image was not promoted"
        exit 1
      fi
    - |
      gcloud run deploy $SERVICE_NAME \
        --image $PROMOTED_AGENT_TAG \
        --region $GCP_REGION \
        --quiet
    - echo "AGENT_DEPLOYED_PROD=true" >> deploy-agent-prod.env
    - echo "AGENT_URL_PROD=$(gcloud run services describe $SERVICE_NAME --region $GCP_REGION --format 'value(status.url)')" >> deploy-agent-prod.env
  artifacts:
    reports:
      dotenv: deploy-agent-prod.env
