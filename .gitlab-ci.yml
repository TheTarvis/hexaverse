# =============================================================================
# =============================================================================
# PROMOTE STAGE - Manual Gate to Production
# =============================================================================

promote-to-prod:
  stage: promote
  image: ${GCP_DEPLOYER_IMAGE}
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  needs:
    - job: plan-prod
      optional: true
      artifacts: false
    - job: build-backend
      artifacts: true
      optional: true
    - job: build-agent
      artifacts: true
      optional: true
    - job: deploy-backend-dev
      optional: true
    - job: deploy-agent-dev
      optional: true
  variables:
    <<: *prod-env-vars
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  <<: *gcp-auth
  script:
    # Authenticate to both dev and prod Artifact Registries
    - gcloud auth configure-docker us-central1-docker.pkg.dev

    # Promote backend image if it was built (IMAGE_TAG is set by build-backend job)
    - |
      if [ -n "$IMAGE_TAG" ]; then
        export DEV_BACKEND_TAG="us-central1-docker.pkg.dev/hexaverse-game-dev/hexaverse/backend:dev-${CI_COMMIT_SHORT_SHA}"
        export PROD_BACKEND_TAG="us-central1-docker.pkg.dev/hexaverse/hexaverse/backend:prod-${CI_COMMIT_SHORT_SHA}"
        echo "Promoting backend image..."
        echo "From (dev) - $DEV_BACKEND_TAG"
        echo "To (prod) - $PROD_BACKEND_TAG"
        docker pull $DEV_BACKEND_TAG
        docker tag $DEV_BACKEND_TAG $PROD_BACKEND_TAG
        docker push $PROD_BACKEND_TAG
        echo "PROMOTED_BACKEND_TAG=$PROD_BACKEND_TAG" >> promote.env
      else
        echo "Skipping backend promotion - no backend changes in this commit"
      fi

    # Promote agent image if it was built (AGENT_IMAGE_TAG is set by build-agent job)
    - |
      if [ -n "$AGENT_IMAGE_TAG" ]; then
        export DEV_AGENT_TAG="us-central1-docker.pkg.dev/hexaverse-game-dev/hexaverse/claude-agent:dev-${CI_COMMIT_SHORT_SHA}"
        export PROD_AGENT_TAG="us-central1-docker.pkg.dev/hexaverse/hexaverse/claude-agent:prod-${CI_COMMIT_SHORT_SHA}"
        echo "Promoting agent image..."
        echo "From (dev) - $DEV_AGENT_TAG"
        echo "To (prod) - $PROD_AGENT_TAG"
        docker pull $DEV_AGENT_TAG
        docker tag $DEV_AGENT_TAG $PROD_AGENT_TAG
        docker push $PROD_AGENT_TAG
        echo "PROMOTED_AGENT_TAG=$PROD_AGENT_TAG" >> promote.env
      else
        echo "Skipping agent promotion - no agent changes in this commit"
      fi
  artifacts:
    reports:
      dotenv: promote.env
    expire_in: 7 days
  environment:
    name: prod
    action: prepare

# =============================================================================
# DEPLOY-PROD STAGE - Deploy to Production
# =============================================================================

# Plan Prod: Terraform plan for prod infrastructure
plan-prod:
  stage: promote
  image:
    name: ${TERRAFORM_DEPLOYER_IMAGE}
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      <<: *infra-changes
  variables:
    <<: *prod-env-vars
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
  <<: *gcp-auth
  script:
    - cd infra/terraform

    # Set Terraform variables from GitLab CI variables
    - export TF_VAR_vercel_api_token="${VERCEL_API_TOKEN}"
    - '[ -n "$GOOGLE_OAUTH_CLIENT_ID_PROD" ] && export TF_VAR_google_oauth_client_id="$GOOGLE_OAUTH_CLIENT_ID_PROD" || true'
    - '[ -n "$GOOGLE_OAUTH_CLIENT_SECRET_PROD" ] && export TF_VAR_google_oauth_client_secret="$GOOGLE_OAUTH_CLIENT_SECRET_PROD" || true'
    - '[ -n "$STRIPE_PUBLISHABLE_KEY_PROD" ] && export TF_VAR_stripe_publishable_key="$STRIPE_PUBLISHABLE_KEY_PROD" || true'
    # Secret Manager values
    - '[ -n "$ANTHROPIC_API_KEY_PROD" ] && export TF_VAR_anthropic_api_key="$ANTHROPIC_API_KEY_PROD" || true'
    - '[ -n "$RESEND_API_KEY_PROD" ] && export TF_VAR_resend_api_key="$RESEND_API_KEY_PROD" || true'
    - '[ -n "$STRIPE_SECRET_KEY_PROD" ] && export TF_VAR_stripe_secret_key="$STRIPE_SECRET_KEY_PROD" || true'
    - '[ -n "$STRIPE_WEBHOOK_SECRET_PROD" ] && export TF_VAR_stripe_webhook_secret="$STRIPE_WEBHOOK_SECRET_PROD" || true'
    - '[ -n "$STRIPE_PRO_MONTHLY_PRICE_ID_PROD" ] && export TF_VAR_stripe_pro_monthly_price_id="$STRIPE_PRO_MONTHLY_PRICE_ID_PROD" || true'
    - '[ -n "$STRIPE_PRO_ANNUAL_PRICE_ID_PROD" ] && export TF_VAR_stripe_pro_annual_price_id="$STRIPE_PRO_ANNUAL_PRICE_ID_PROD" || true'

    - |
      terraform init \
        -backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/hexaverse-gcp" \
        -backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/hexaverse-gcp/lock" \
        -backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/hexaverse-gcp/lock"
    - terraform fmt -check -recursive
    - terraform validate
    - terraform plan -var-file=environments/${ENVIRONMENT}.tfvars -out=tfplan-prod
    - terraform show -json tfplan-prod > tfplan-prod.json
  artifacts:
    reports:
      terraform: infra/terraform/tfplan-prod.json
    paths:
      - infra/terraform/tfplan-prod
      - infra/terraform/tfplan-prod.json
      - infra/terraform/.terraform.lock.hcl
    expire_in: 1 day
  environment:
    name: prod
    action: prepare
  resource_group: prod-infrastructure

# Apply Prod: Terraform apply for prod (automatic - no manual gate)
apply-prod:
  stage: deploy-prod
  image:
    name: ${TERRAFORM_DEPLOYER_IMAGE}
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      <<: *infra-changes
  needs:
    - job: plan-prod
      artifacts: true
    - job: promote-to-prod
  variables:
    <<: *prod-env-vars
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
  <<: *gcp-auth
  script:
    - cd infra/terraform

    # Set Terraform variables from GitLab CI variables
    - export TF_VAR_vercel_api_token="${VERCEL_API_TOKEN}"
    - '[ -n "$GOOGLE_OAUTH_CLIENT_ID_PROD" ] && export TF_VAR_google_oauth_client_id="$GOOGLE_OAUTH_CLIENT_ID_PROD" || true'
    - '[ -n "$GOOGLE_OAUTH_CLIENT_SECRET_PROD" ] && export TF_VAR_google_oauth_client_secret="$GOOGLE_OAUTH_CLIENT_SECRET_PROD" || true'
    - '[ -n "$STRIPE_PUBLISHABLE_KEY_PROD" ] && export TF_VAR_stripe_publishable_key="$STRIPE_PUBLISHABLE_KEY_PROD" || true'
    # Secret Manager values
    - '[ -n "$ANTHROPIC_API_KEY_PROD" ] && export TF_VAR_anthropic_api_key="$ANTHROPIC_API_KEY_PROD" || true'
    - '[ -n "$RESEND_API_KEY_PROD" ] && export TF_VAR_resend_api_key="$RESEND_API_KEY_PROD" || true'
    - '[ -n "$STRIPE_SECRET_KEY_PROD" ] && export TF_VAR_stripe_secret_key="$STRIPE_SECRET_KEY_PROD" || true'
    - '[ -n "$STRIPE_WEBHOOK_SECRET_PROD" ] && export TF_VAR_stripe_webhook_secret="$STRIPE_WEBHOOK_SECRET_PROD" || true'
    - '[ -n "$STRIPE_PRO_MONTHLY_PRICE_ID_PROD" ] && export TF_VAR_stripe_pro_monthly_price_id="$STRIPE_PRO_MONTHLY_PRICE_ID_PROD" || true'
    - '[ -n "$STRIPE_PRO_ANNUAL_PRICE_ID_PROD" ] && export TF_VAR_stripe_pro_annual_price_id="$STRIPE_PRO_ANNUAL_PRICE_ID_PROD" || true'

    - |
      terraform init \
        -backend-config="address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/hexaverse-gcp" \
        -backend-config="lock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/hexaverse-gcp/lock" \
        -backend-config="unlock_address=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/terraform/state/hexaverse-gcp/lock"
    - terraform apply -var-file=environments/${ENVIRONMENT}.tfvars -auto-approve
    - echo "INFRA_APPLIED_PROD=true" >> ../../infra-prod.env
  artifacts:
    reports:
      dotenv: infra-prod.env
    expire_in: 7 days
  environment:
    name: prod
    action: prepare
  resource_group: prod-infrastructure


# Deploy Backend Prod: Cloud Run deployment with promoted image
deploy-backend-prod:
  stage: deploy-prod
  image: google/cloud-sdk:alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      <<: *backend-changes
  needs:
    - job: promote-to-prod
      artifacts: true
    - job: apply-prod
      optional: true
      artifacts: false
  variables:
    <<: *prod-env-vars
    SERVICE_NAME: "hexaverse-backend"
  <<: *gcp-auth
  script:
    - |
      if [ -z "$PROMOTED_BACKEND_TAG" ]; then
        echo "ERROR: PROMOTED_BACKEND_TAG not set - backend image was not promoted"
        exit 1
      fi
    - |
      gcloud run deploy $SERVICE_NAME \
        --image $PROMOTED_BACKEND_TAG \
        --region $GCP_REGION \
        --quiet
    - echo "BACKEND_DEPLOYED_PROD=true" >> deploy-prod.env
    - echo "BACKEND_URL_PROD=$(gcloud run services describe $SERVICE_NAME --region $GCP_REGION --format 'value(status.url)')" >> deploy-prod.env
  artifacts:
    reports:
      dotenv: deploy-prod.env
    expire_in: 7 days
  environment:
    name: prod
    url: https://hexaverse-backend.run.app
  resource_group: prod-backend

# Deploy Frontend Prod: Vercel production deployment (full rebuild)
deploy-frontend-prod:
  stage: deploy-prod
  image: ${FRONTEND_BUILDER_IMAGE}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      <<: *frontend-changes
  needs:
    - job: promote-to-prod
    - job: deploy-backend-prod
      optional: true
      artifacts: false
  variables:
    <<: *prod-env-vars
  script:
    - cd frontend
    # Pull Vercel environment variables (managed by Terraform)
    - vercel pull --yes --environment=production --token=$VERCEL_API_TOKEN
    # Build for production (optimized, minified, no source maps)
    - vercel build --prod --token=$VERCEL_API_TOKEN
    # Deploy to production
    - vercel deploy --prebuilt --prod --token=$VERCEL_API_TOKEN > deployment-url.txt
    - export DEPLOYMENT_URL=$(cat deployment-url.txt)
    - echo "FRONTEND_DEPLOYED_PROD=true" >> ../deploy-frontend-prod.env
    - echo "FRONTEND_URL_PROD=$DEPLOYMENT_URL" >> ../deploy-frontend-prod.env
  artifacts:
    reports:
      dotenv: deploy-frontend-prod.env
    expire_in: 7 days
  environment:
    name: prod
    url: https://hexaverse.vercel.app

# Deploy Agent Prod: Cloud Run deployment with promoted image
deploy-agent-prod:
  stage: deploy-prod
  image: google/cloud-sdk:alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      <<: *agent-changes
  needs:
    - job: promote-to-prod
