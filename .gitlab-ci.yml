# Deploy Backend Dev: Cloud Run deployment
deploy-backend-dev:
  stage: deploy-dev
  image: google/cloud-sdk:alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *backend-changes
      when: never  # Don't deploy on MRs
    - if: '$CI_COMMIT_BRANCH == "main"'
      <<: *backend-changes
  needs:
    - job: test-backend
      artifacts: false
    - job: build-backend
      artifacts: true
    - job: apply-dev
      optional: true
      artifacts: false
  variables:
    <<: *dev-env-vars
    SERVICE_NAME: "hexaverse-backend"
  <<: *gcp-auth
  script:
    - |
      gcloud run deploy $SERVICE_NAME \
        --image $IMAGE_TAG \
        --region $GCP_REGION \
        --quiet
    - echo "BACKEND_DEPLOYED_DEV=true" >> deploy-dev.env
    - echo "BACKEND_URL_DEV=$(gcloud run services describe $SERVICE_NAME --region $GCP_REGION --format 'value(status.url)')" >> deploy-dev.env
  artifacts:
    reports:
      dotenv: deploy-dev.env
    expire_in: 7 days
  environment:
    name: dev
    url: https://hexaverse-backend-dev.run.app
  resource_group: dev-backend

# Deploy Frontend Dev: Vercel preview deployment
deploy-frontend-dev:
  stage: deploy-dev
  image: ${FRONTEND_BUILDER_IMAGE}
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *frontend-changes
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      <<: *frontend-changes
  needs:
    - job: test-frontend
      artifacts: false
    - job: apply-dev
      optional: true
      artifacts: false
    - job: deploy-backend-dev
      optional: true
      artifacts: false
  variables:
    <<: *dev-env-vars
  script:
    - cd frontend
    # Pull Vercel environment variables (managed by Terraform)
    - vercel pull --yes --environment=dev --token=$VERCEL_API_TOKEN
    # Build for preview (includes source maps, debug symbols)
    - vercel build --target=dev --token=$VERCEL_API_TOKEN
    # Deploy to preview
    - vercel deploy --prebuilt --target=dev --token=$VERCEL_API_TOKEN > deployment-url.txt
    - export DEPLOYMENT_URL=$(cat deployment-url.txt)
    - echo "FRONTEND_DEPLOYED_DEV=true" >> ../deploy-frontend-dev.env
    - echo "FRONTEND_URL_DEV=$DEPLOYMENT_URL" >> ../deploy-frontend-dev.env
  artifacts:
    reports:
