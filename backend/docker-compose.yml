services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "${PORT_DYNAMODB:-20255}:8000"
    volumes:
      - ./ddbdata:/home/dynamodblocal/data
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    networks:
      - flywheel-network

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: flywheel-dynamodb-admin
    ports:
      - "${PORT_DYNAMODB_ADMIN:-20256}:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    networks:
      - flywheel-network

  minio:
    image: minio/minio:latest
    container_name: flywheel-minio
    ports:
      - "${PORT_MINIO:-20252}:9000"   # S3 API
      - "${PORT_MINIO_CONSOLE:-20253}:9001"   # Web Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - flywheel-network

  postgres:
    # Custom image with pre-seeded test data for Flywheel e2e testing
    # Local build: docker build --platform linux/arm64 -f infra/docker/postgres-test.Dockerfile -t flywheel-postgres-test:latest .
    # Or use pre-built from GCP: us-central1-docker.pkg.dev/flywheel-etl-prod/flywheel-ci/postgres-test:latest
    image: flywheel-postgres-test:latest
    container_name: flywheel-postgres
    ports:
      - "${PORT_POSTGRES:-20250}:5432"
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=testdb
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - flywheel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  flywheel-network:
    name: flywheel-network
    driver: bridge