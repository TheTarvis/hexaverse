<div id="hud-button-options" class="viz-carousel viz-dotted-background" aria-label="HUD toolbar options">
  <section data-variant="Framed rail" aria-label="Framed rail">
    <div class="hx-stage rail">
      <nav class="hx-controls hx-frame" aria-label="Framed rail controls">
        <button aria-label="Objects" aria-pressed="false"><i data-lucide="search" aria-hidden="true"></i></button>
        <button aria-label="Command" aria-pressed="true"><i data-lucide="rocket" aria-hidden="true"></i></button>
        <button aria-label="Galaxy" aria-pressed="false"><i data-lucide="log-out" aria-hidden="true"></i></button>
        <button aria-label="Settings" aria-pressed="false"><i data-lucide="settings" aria-hidden="true"></i></button>
      </nav>
      <div class="hx-context hx-frame"><span class="hx-plaque">COMMAND</span><span class="hx-kicker">Command fleet</span><strong>Peregrine</strong><span>Docked at mmm Station</span></div>
    </div>
  </section>
  <section data-variant="Separate keys" aria-label="Separate keys" hidden>
    <div class="hx-stage keys">
      <nav class="hx-controls" aria-label="Separate keys controls">
        <button class="hx-frame" aria-label="Objects" aria-pressed="false"><i data-lucide="search" aria-hidden="true"></i></button>
        <button class="hx-frame" aria-label="Command" aria-pressed="true"><i data-lucide="rocket" aria-hidden="true"></i></button>
        <button class="hx-frame" aria-label="Galaxy" aria-pressed="false"><i data-lucide="log-out" aria-hidden="true"></i></button>
        <button class="hx-frame" aria-label="Settings" aria-pressed="false"><i data-lucide="settings" aria-hidden="true"></i></button>
      </nav>
      <div class="hx-context hx-frame"><span class="hx-plaque">COMMAND</span><span class="hx-kicker">Command fleet</span><strong>Peregrine</strong><span>Docked at mmm Station</span></div>
    </div>
  </section>
  <section data-variant="Labeled tabs" aria-label="Labeled tabs" hidden>
    <div class="hx-stage tabs">
      <nav class="hx-controls" aria-label="Labeled tab controls">
        <button class="hx-frame" aria-label="Objects" aria-pressed="false"><i data-lucide="search" aria-hidden="true"></i><span>Objects</span></button>
        <button class="hx-frame" aria-label="Command" aria-pressed="true"><i data-lucide="rocket" aria-hidden="true"></i><span>Command</span></button>
        <button class="hx-frame" aria-label="Galaxy" aria-pressed="false"><i data-lucide="log-out" aria-hidden="true"></i><span>Galaxy</span></button>
        <button class="hx-frame" aria-label="Settings" aria-pressed="false"><i data-lucide="settings" aria-hidden="true"></i><span>Settings</span></button>
      </nav>
      <div class="hx-context hx-frame"><span class="hx-plaque">COMMAND</span><span class="hx-kicker">Command fleet</span><strong>Peregrine</strong><span>Docked at mmm Station</span></div>
    </div>
  </section>
  <section data-variant="Split dock" aria-label="Split dock" hidden>
    <div class="hx-stage split">
      <nav class="hx-controls" aria-label="Split dock controls">
        <div class="hx-main hx-frame">
          <button aria-label="Objects" aria-pressed="false"><i data-lucide="search" aria-hidden="true"></i></button>
          <button aria-label="Command" aria-pressed="true"><i data-lucide="rocket" aria-hidden="true"></i></button>
        </div>
        <button class="hx-frame" aria-label="Galaxy" aria-pressed="false"><i data-lucide="log-out" aria-hidden="true"></i></button>
        <button class="hx-frame" aria-label="Settings" aria-pressed="false"><i data-lucide="settings" aria-hidden="true"></i></button>
      </nav>
      <div class="hx-context hx-frame"><span class="hx-plaque">COMMAND</span><span class="hx-kicker">Command fleet</span><strong>Peregrine</strong><span>Docked at mmm Station</span></div>
    </div>
  </section>
</div>
<style>
#hud-button-options { --hx-ink:#d5e7f1; --hx-cyan:#b1edff; --hx-edge:#59788c; --hx-panel:#0a141e; --hx-glow:0.65; }
#hud-button-options .hx-stage { box-sizing:border-box; min-height:350px; padding:38px 12px 30px; display:flex; flex-direction:column; align-items:center; gap:42px; color:var(--hx-ink); font:14px/1.5 system-ui,sans-serif; }
#hud-button-options .hx-controls { display:flex; align-items:center; gap:6px; max-width:100%; }
#hud-button-options .hx-frame { --cut:10px; position:relative; isolation:isolate; background:var(--hx-panel); }
#hud-button-options .hx-frame::before,#hud-button-options .hx-frame::after { content:''; position:absolute; pointer-events:none; z-index:-1; clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut)); }
#hud-button-options .hx-frame::before { inset:0; background:linear-gradient(135deg,var(--hx-cyan),var(--hx-edge) 24%,#243c4d 55%,var(--hx-cyan)); }
#hud-button-options .hx-frame::after { inset:2px; background:var(--hx-panel); }
#hud-button-options button { position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0; width:48px; height:48px; padding:12px; border:0; border-radius:0; background:transparent; color:var(--hx-cyan); font:inherit; }
#hud-button-options button svg { width:20px; height:20px; stroke-width:1.5; }
#hud-button-options button::marker { content:''; }
#hud-button-options button[aria-pressed='true'] { color:#edfcff; background:linear-gradient(0deg,#25566a88,#16313c44); }
#hud-button-options button[aria-pressed='true'] svg { filter:drop-shadow(0 0 5px #76e3ef); }
#hud-button-options button:focus-visible { outline:2px solid var(--hx-cyan); outline-offset:4px; }
#hud-button-options button:hover { color:#fff; }
#hud-button-options .rail .hx-controls { padding:6px 10px; gap:0; filter:drop-shadow(0 0 4px #76e3ef44); }
#hud-button-options .rail button[aria-pressed='true']::after,#hud-button-options .split .hx-main button[aria-pressed='true']::after { content:''; position:absolute; inset:auto 10px 3px; height:2px; background:var(--hx-cyan); box-shadow:0 0 8px rgba(118,227,239,var(--hx-glow)); }
#hud-button-options .keys .hx-controls { gap:10px; }
#hud-button-options .keys button { width:54px; height:54px; }
#hud-button-options .keys button[aria-pressed='true']::before,#hud-button-options .tabs button[aria-pressed='true']::before { background:var(--hx-cyan); }
#hud-button-options .keys button[aria-pressed='true'],#hud-button-options .tabs button[aria-pressed='true'] { filter:drop-shadow(0 0 5px rgba(118,227,239,var(--hx-glow))); }
#hud-button-options .keys button[aria-pressed='true']::after,#hud-button-options .tabs button[aria-pressed='true']::after { background:#153341; }
#hud-button-options .tabs .hx-controls { gap:4px; }
#hud-button-options .tabs button { width:72px; height:64px; padding:10px 3px; flex-direction:column; gap:5px; font-size:11px; letter-spacing:.02em; --cut:8px; }
#hud-button-options .split .hx-controls { gap:8px; }
#hud-button-options .split .hx-main { display:flex; padding:5px 8px; margin-right:6px; }
#hud-button-options .split .hx-controls > button { width:48px; height:48px; }
#hud-button-options .hx-context { width:min(312px,100%); box-sizing:border-box; display:flex; flex-direction:column; gap:7px; padding:29px 22px 24px; --cut:16px; filter:drop-shadow(0 0 3px #76e3ef44); }
#hud-button-options .hx-context::before { background:linear-gradient(135deg,#c1f3ff 0%,#5a7a90 15%,#2b4356 52%,#b1edff 100%); }
#hud-button-options .hx-context::after { inset:4px; }
#hud-button-options .hx-kicker { font-size:11px; letter-spacing:.12em; color:#94adbd; }
#hud-button-options .hx-context strong { font-size:17px; font-weight:500; }
#hud-button-options .hx-context > span:last-child { color:#aabecb; font-size:13px; }
#hud-button-options .hx-plaque { position:absolute; top:-12px; left:50%; transform:translateX(-50%); padding:4px 18px; color:var(--hx-cyan); font:11px/1.4 ui-monospace,monospace; letter-spacing:.12em; background:#314d60; clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%); }
@media(max-width:360px) { #hud-button-options .hx-stage { padding-inline:6px; } #hud-button-options .tabs button { width:65px; } }
</style>
<script>
(() => {
  const root = document.getElementById('hud-button-options');
  root.querySelectorAll('nav').forEach(nav => {
    nav.querySelectorAll('button').forEach(button => {
      button.classList.add('cursor-interaction');
      button.addEventListener('click', () => {
        nav.querySelectorAll('button').forEach(peer => peer.setAttribute('aria-pressed', String(peer === button)));
        const label = button.getAttribute('aria-label');
        const stage = nav.closest('.hx-stage');
        stage.querySelector('.hx-plaque').textContent = label.toUpperCase();
        const content = {Objects:['Known objects','mmm Station','Station · Quauade Prime −3.6'],Command:['Command fleet','Peregrine','Docked at mmm Station'],Galaxy:['Selected system','Quauade Prime −3.6','Enter system'],Settings:['HUD arrangement','Objects · Command','Show, hide and arrange panels']}[label];
        stage.querySelector('.hx-kicker').textContent = content[0];
        stage.querySelector('strong').textContent = content[1];
        stage.querySelector('.hx-context > span:last-child').textContent = content[2];
      });
    });
  });
  const state = {glow:0.65};
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:() => root.style.setProperty('--hx-glow',state.glow)});
    tweak.addSlider(state,'glow',{label:'Selection glow',min:0,max:1,step:0.05});
  }
})();
</script>
