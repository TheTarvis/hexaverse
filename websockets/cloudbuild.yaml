steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA']

  # Deploy container image to Cloud Run for colony clients
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'websocket-server-colony'
      - '--image=gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--no-use-http2'
      - '--min-instances=0'
      - '--memory=256Mi'
      - '--service-account=$PROJECT_NUMBER-compute@developer.gserviceaccount.com'
      - '--set-env-vars=PUBSUB_PROJECT_ID=$PROJECT_ID,PUBSUB_TOPIC_ID=colony-events,ENV=production'
    id: 'deploy-colony'

  # Deploy container image to Cloud Run for draw clients
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'websocket-server-draw'
      - '--image=gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--no-use-http2'
      - '--min-instances=0'
      - '--memory=256Mi'
      - '--service-account=$PROJECT_NUMBER-compute@developer.gserviceaccount.com'
      - '--set-env-vars=PUBSUB_PROJECT_ID=$PROJECT_ID,PUBSUB_TOPIC_ID=drawing-events,ENV=production'
    id: 'deploy-draw'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/websocket-server:$COMMIT_SHA'

timeout: '1200s'

# Using logs bucket instead of logging options
logs_bucket: 'gs://websocket-server-build-logs'
